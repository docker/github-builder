name: .test-bake

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'releases/v*'
    paths:
      - '.github/workflows/.test-bake.yml'
      - '.github/workflows/bake.yml'
      - '.github/workflows/setup-registry-identities.yml'
      - '.github/workflows/verify.yml'
      - 'test/**'
  pull_request:
    paths:
      - '.github/workflows/.test-bake.yml'
      - '.github/workflows/bake.yml'
      - '.github/workflows/setup-registry-identities.yml'
      - '.github/workflows/verify.yml'
      - 'test/**'

jobs:
  bake-dockerhub-single:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      job-name-prefix: bake-dockerhub-single
      cache: true
      cache-scope: bake-dockerhub-single
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          expires_in: 7200
      meta-images: |
        docker.io/dockereng/github-builder-test
      meta-tags: |
        type=raw,value=bake-ghbuilder-single-${{ github.run_id }}

  bake-dockerhub-single-verify:
    uses: ./.github/workflows/verify.yml
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-dockerhub-single
    permissions:
      contents: read
      id-token: write
    with:
      builder-outputs: ${{ toJSON(needs.bake-dockerhub-single.outputs) }}
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          expires_in: 7200

  bake-dockerhub-single-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-dockerhub-single
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-dockerhub-single.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-proxy-network:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
    with:
      cache: true
      cache-scope: bake-proxynettest
      context: test
      output: local
      target: proxy-network
      buildkit-proxy-network: true

  bake-ecr-public:
    uses: ./.github/workflows/bake.yml
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    with:
      context: test
      output: image
      push: true
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello
      registry-identities: |
        - type: aws-ecr
          registry: public.ecr.aws
          role-to-assume: arn:aws:iam::175142243308:role/official_gha_cicd
          region: us-east-1
      meta-images: |
        public.ecr.aws/q3b5f1u4/test-docker-action
      meta-tags: |
        type=raw,value=bake-ecr-public-${{ github.run_id }}

  bake-ecr-private:
    uses: ./.github/workflows/bake.yml
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    with:
      context: test
      output: image
      push: true
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello
      registry-identities: |
        - type: aws-ecr
          registry: 175142243308.dkr.ecr.us-east-2.amazonaws.com
          role-to-assume: arn:aws:iam::175142243308:role/official_gha_cicd
          region: us-east-1
      meta-images: |
        175142243308.dkr.ecr.us-east-2.amazonaws.com/sandbox/test-docker-action
      meta-tags: |
        type=raw,value=bake-ecr-private-${{ github.run_id }}

  bake-dockerhub:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      cache: true
      cache-scope: bake-dockerhub
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      runner: |
        default=ubuntu-26.04
        linux/arm=ubuntu-26.04-arm
        linux/arm64=ubuntu-26.04-arm
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      meta-images: |
        docker.io/dockereng/github-builder-test
      meta-tags: |
        type=raw,value=bake-ghbuilder-${{ github.run_id }}

  bake-dockerhub-verify:
    uses: ./.github/workflows/verify.yml
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-dockerhub
    permissions:
      contents: read
      id-token: write
    with:
      builder-outputs: ${{ toJSON(needs.bake-dockerhub.outputs) }}
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

  bake-dockerhub-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-dockerhub
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-dockerhub.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-dockerhub-scan:
    runs-on: ubuntu-26.04
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-dockerhub
    steps:
      -
        name: Scan for vulnerabilities
        uses: crazy-max/ghaction-container-scan@ffcba8deb5cb3531954cbedbbcd0179d79edf510 # v4.1.0
        with:
          image: docker.io/dockereng/github-builder-test@${{ needs.bake-dockerhub.outputs.digest }}

  bake-dockerhub-nosign:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      cache: true
      cache-scope: bake-dockerhub-nosign
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      sign: false
      target: hello-cross
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      meta-images: |
        docker.io/dockereng/github-builder-test
      meta-tags: |
        type=raw,value=bake-ghbuilder-nosign-${{ github.run_id }}

  bake-dockerhub-nosign-verify:
    uses: ./.github/workflows/verify.yml
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-dockerhub-nosign
    with:
      builder-outputs: ${{ toJSON(needs.bake-dockerhub-nosign.outputs) }}

  bake-dockerhub-nosign-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-dockerhub-nosign
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-dockerhub-nosign.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-ghcr-and-dockerhub:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      meta-images: |
        ghcr.io/docker/github-builder-test
        docker.io/dockereng/github-builder-test
      meta-tags: |
        type=raw,value=${{ github.run_id }},prefix=bake-ghcr-and-dockerhub-
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  bake-ghcr-and-dockerhub-verify:
    uses: ./.github/workflows/verify.yml
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-ghcr-and-dockerhub
    permissions:
      contents: read
      id-token: write
    with:
      builder-outputs: ${{ toJSON(needs.bake-ghcr-and-dockerhub.outputs) }}
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  bake-ghcr-and-dockerhub-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-ghcr-and-dockerhub
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-ghcr-and-dockerhub.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-local:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: bake-output
      artifact-upload: true
      artifact-retention-days: 1
      context: test
      output: local
      sbom: true
      sign: ${{ github.event_name != 'pull_request' }}
      target: hello-cross

  bake-local-verify:
    uses: ./.github/workflows/verify.yml
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-local
    with:
      builder-outputs: ${{ toJSON(needs.bake-local.outputs) }}

  bake-local-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-local
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-local.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-local-single:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: bake-single-output
      artifact-upload: true
      context: test
      output: local
      sbom: true
      sign: ${{ github.event_name != 'pull_request' }}
      target: hello

  bake-local-single-verify:
    uses: ./.github/workflows/verify.yml
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-local-single
    with:
      builder-outputs: ${{ toJSON(needs.bake-local-single.outputs) }}

  bake-local-single-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-local-single
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-local-single.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-local-noupload:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-upload: false
      context: test
      output: local
      sbom: true
      target: hello-cross

  bake-local-noupload-verify:
    uses: ./.github/workflows/verify.yml
    needs:
      - bake-local-noupload
    with:
      builder-outputs: ${{ toJSON(needs.bake-local-noupload.outputs) }}

  bake-local-noupload-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-local-noupload
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-local-noupload.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-local-nosign:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: bake-nosign-output
      artifact-upload: true
      context: test
      output: local
      sbom: true
      sign: false
      target: hello-cross

  bake-local-nosign-verify:
    uses: ./.github/workflows/verify.yml
    needs:
      - bake-local-nosign
    with:
      builder-outputs: ${{ toJSON(needs.bake-local-nosign.outputs) }}

  bake-local-nosign-outputs:
    runs-on: ubuntu-26.04
    needs:
      - bake-local-nosign
    steps:
      -
        name: Builder outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_BUILDER-OUTPUTS: ${{ toJSON(needs.bake-local-nosign.outputs) }}
        with:
          script: |
            const builderOutputs = JSON.parse(core.getInput('builder-outputs'));
            core.info(JSON.stringify(builderOutputs, null, 2));

  bake-secret:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-upload: false
      context: test
      output: local
      target: foosec
    secrets:
      build-secrets: |+
        fixture.plain: |
          alpha-line
          beta-line
        foosec:
          fixture.json: ${{ toJSON(format('gamma-line{0}delta-line{0}', fromJSON('"\n"'))) }}
          fixture_fuu: standard-secret
          fixture_keep: |+
            keep-line

  bake-set-runner:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      runner: ubuntu-26.04
      context: test
      output: image
      push: false
      registry-identities: |
        - type: dockerhub
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.MISSING_DOCKERHUB_OIDC_CONNECTIONID }}
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      meta-images: |
        docker.io/dockereng/github-builder-test
      meta-tags: |
        type=raw,value=bake-ghbuilder-${{ github.run_id }}

  bake-set-runner-deprecated:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      runner: amd64
      context: test
      output: image
      push: false
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      meta-images: |
        docker.io/dockereng/github-builder-test
      meta-tags: |
        type=raw,value=bake-ghbuilder-${{ github.run_id }}

  bake-qemu:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      setup-qemu: true
      artifact-upload: false
      context: test
      output: local
      sbom: true
      target: hello-cross

  bake-dockerhub-nodistrib:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      distribute: false
      cache: true
      cache-scope: bake-dockerhub-nodistrib
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      registry-identities: |
        - type: dockerhub
          registry: docker.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      meta-images: |
        docker.io/dockereng/github-builder-test
      meta-tags: |
        type=raw,value=bake-ghbuilder-nodistrib-${{ github.run_id }}

  bake-local-nodistrib:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      distribute: false
      artifact-name: bake-nodistrib-output
      artifact-upload: true
      context: test
      output: local
      sbom: true
      sign: ${{ github.event_name != 'pull_request' }}
      target: hello-cross

  bake-vars:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      context: test
      output: image
      push: false
      target: vars
      vars: |
        XX_VERSION=1.9.0
        DOCKER_METADATA_OUTPUT_VERSION=caller-version
      meta-images: example/app
      meta-tags: |
        type=raw,value=vars-one
        type=raw,value=vars-two
      meta-labels: |
        org.example.vars.one=one
        org.example.vars.two=two

  bake-auth-scope:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      meta-images: |
        ghcr.io/docker/github-builder-test
      meta-tags: |
        type=raw,value=bake-ghbuilder-scope-${{ github.run_id }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          scope: '@push'

  bake-auth-scope-verify:
    uses: ./.github/workflows/verify.yml
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-auth-scope
    with:
      builder-outputs: ${{ toJSON(needs.bake-auth-scope.outputs) }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  bake-namedcontexts:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: bake-namedcontexts-output
      artifact-upload: true
      context: test
      output: local
      sbom: true
      sign: ${{ github.event_name != 'pull_request' }}
      target: go-cross-with-contexts

  bake-ghcr-index-annotations:
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      set-meta-annotations: true
      set-meta-labels: true
      meta-images: ghcr.io/docker/github-builder-test
      meta-tags: |
        type=raw,value=bake-index-annotations-${{ github.run_id }}
      meta-labels: |
        io.github.docker.github-builder.test-label=bake-${{ github.run_id }}
      meta-annotations: |
        io.github.docker.github-builder.test-index-annotation=bake-${{ github.run_id }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  bake-ghcr-image-casing:
    strategy:
      matrix:
        include:
          - variant: plain
            images: ghcr.io/docker/GitHub-Builder-Test
          - variant: attributes
            images: |
              name=registry.invalid/disabled/app,enable=false
              name=ghcr.io/docker/GitHub-Builder-Test,enable=true
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: test
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set: |
        *.args.VERSION={{meta.version}}
      target: hello-cross
      set-meta-annotations: true
      meta-images: ${{ matrix.images }}
      meta-tags: |
        type=raw,value=bake-image-casing-${{ matrix.variant }}-${{ github.run_id }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  bake-local-login:
    uses: ./.github/workflows/bake.yml
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: bake-login-output
      artifact-upload: true
      context: test
      output: local
      registry-login: true
      sbom: true
      sign: true
      target: dhi
      registry-identities: |
        - type: dockerhub
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
          connection_id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          scope: 'dhi.io@pull'

  bake-source-date-epoch:
    strategy:
      matrix:
        epoch:
          - '0'
          - '1704067200'
          - 'commit'
        output:
          - image
          - local
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: ${{ matrix.output }}
      push: ${{ matrix.output == 'image' && github.event_name != 'pull_request' }}
      source-date-epoch: ${{ matrix.epoch }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/docker/github-builder-test
      meta-tags: |
        type=raw,value=bake-epoch-${{ matrix.epoch }}-${{ github.run_id }}-${{ github.run_attempt }}
      meta-labels: |
        org.opencontainers.image.created=2000-01-01T00:00:00Z
      meta-annotations: |
        org.opencontainers.image.created=2000-01-01T00:00:00Z
      context: test
      target: source-date-epoch
      set: |
        *.args.SOURCE_DATE_EPOCH=1
        *.args.EXPECTED_EPOCH=${{ matrix.epoch }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  bake-source-date-epoch-verify:
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-source-date-epoch
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    strategy:
      matrix:
        epoch:
          - '0'
          - '1704067200'
          - 'commit'
    steps:
      -
        name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Check image file timestamp
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE: ghcr.io/docker/github-builder-test:bake-epoch-${{ matrix.epoch }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');

            const image = process.env.IMAGE;
            await exec.exec('docker', ['pull', '--platform', 'linux/amd64', image]);
            const {stdout} = await exec.getExecOutput('docker', ['create', '--platform', 'linux/amd64', image, '/unused']);
            const container = stdout.trim();
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), 'source-date-epoch-'));
            try {
              const file = path.join(directory, 'epoch');
              await exec.exec('docker', ['cp', `${container}:/epoch`, file]);
              const epoch = Number(fs.readFileSync(file, 'utf8').trim());
              const mtime = fs.statSync(file).mtimeMs / 1000;
              assert.equal(mtime, epoch, `Expected image file timestamp ${epoch}, got ${mtime}`);
              core.info(`Image file timestamp matches SOURCE_DATE_EPOCH=${epoch}`);
            } finally {
              await exec.exec('docker', ['rm', container]);
              fs.rmSync(directory, {recursive: true, force: true});
            }

  bake-compression:
    strategy:
      matrix:
        include:
          - variant: default
            compression: ''
            level: ''
            force: false
          - variant: zstd
            compression: zstd
            level: '0'
            force: false
          - variant: zstd-force
            compression: zstd
            level: '9'
            force: true
    uses: ./.github/workflows/bake.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      compression: ${{ matrix.compression }}
      compression-level: ${{ matrix.level }}
      force-compression: ${{ matrix.force }}
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      context: test
      target: compression
      meta-images: ghcr.io/docker/github-builder-test
      meta-tags: |
        type=raw,value=bake-compression-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  bake-compression-check:
    runs-on: ubuntu-26.04
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - bake-compression
    strategy:
      matrix:
        include:
          - variant: default
            base: gzip
            added: gzip
          - variant: zstd
            base: gzip
            added: zstd
          - variant: zstd-force
            base: zstd
            added: zstd
    steps:
      -
        name: Check image layer compression
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_IMAGE: ghcr.io/docker/github-builder-test
          INPUT_TAG: bake-compression-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          INPUT_BASE-COMPRESSION: ${{ matrix.base }}
          INPUT_ADDED-COMPRESSION: ${{ matrix.added }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const image = core.getInput('image');
            const inspect = async ref => {
              const {stdout} = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', '--raw', ref], {silent: true});
              return JSON.parse(stdout);
            };
            const index = await inspect(`${image}:${core.getInput('tag')}`);
            const manifests = index.manifests.filter(manifest => manifest.platform?.os === 'linux');
            assert.deepEqual(manifests.map(manifest => manifest.platform.architecture).sort(), ['amd64', 'arm64']);
            for (const {digest} of manifests) {
              const {layers} = await inspect(`${image}@${digest}`);
              assert.ok(layers.length >= 2, 'Expected base image layers and the fixture layer');
              const expected = layers.map((_, index) => core.getInput(index === layers.length - 1 ? 'added-compression' : 'base-compression'));
              const actual = layers.map(layer => layer.mediaType.split('+').pop());
              assert.deepEqual(actual, expected, `Unexpected layer compression for ${image}@${digest}`);
            }
